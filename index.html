<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOOM App - Bienestar Emocional</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 50px 40px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            max-width: 500px;
        }
        h1 { font-size: 48px; margin-bottom: 15px; }
        .subtitle { font-size: 18px; margin-bottom: 40px; opacity: 0.9; }
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        a {
            display: inline-block;
            padding: 14px 30px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
            font-weight: bold;
            font-size: 16px;
        }
        a:hover { background: #45a049; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌸 BLOOM</h1>
        <p class="subtitle">Bienestar Emocional y Apoyo Personal</p>
        <div class="links">
            <a href="privacy-policy.html">📋 Política de Privacidad</a>
            <a href="app-ads.txt">📝 Configuración de Anuncios</a>
        </div>
    </div>
</body>
</html>
